services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: root
      MARIADB_PASSWORD: "P@ssw0rd"
      MARIADB_DATABASE: inf2003
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: cfays7x0k5aa0xskmnpm4lr6f7m3tgg4
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: root
      MONGO_PASSWORD: "P@ssw0rd"
      MONGO_DATABASE: inf2003
    depends_on:
      mariadb:
        condition: service_healthy
      mongo:
        condition: service_healthy

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    profiles: [tools]
    environment:
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_USER: root
      MARIADB_PASSWORD: "P@ssw0rd"
      MARIADB_DATABASE: inf2003
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_USER: root
      MONGO_PASSWORD: "P@ssw0rd"
      MONGO_DATABASE: inf2003
      DATAGOV_API_KEY: ${DATAGOV_API_KEY:-}
      USER_PASSWORD: ${USER_PASSWORD:-P@ssw0rd}
    depends_on:
      mariadb:
        condition: service_healthy
      mongo:
        condition: service_healthy

  mariadb:
    image: mariadb:12
    environment:
      MARIADB_ROOT_PASSWORD: "P@ssw0rd"
      MARIADB_DATABASE: inf2003
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: "P@ssw0rd"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''db.adminCommand("ping").ok'' >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb_data:
  mongo_data:
